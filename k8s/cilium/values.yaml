# Cilium CNI — Talos / bare-metal home lab
# Install: helm upgrade --install cilium cilium/cilium -n kube-system -f values.yaml
# Repo:    helm repo add cilium https://helm.cilium.io/

# Replace kube-proxy with eBPF
kubeProxyReplacement: true
k8sServiceHost: 192.168.1.71   # talos-cp IP (control plane endpoint)
k8sServicePort: 6443

# Talos-specific: read node config from kernel args
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# L2 announcements — replaces MetalLB on Flannel clusters
l2announcements:
  enabled: true

# ExternalIPs for LoadBalancer services (L2 announcement pool defined separately)
externalIPs:
  enabled: true

# Hubble observability UI
hubble:
  relay:
    enabled: true
  ui:
    enabled: true

ipam:
  mode: kubernetes

# Required on Talos: mount /proc/sys/net/ipv4 for BPF masquerade
bpf:
  masquerade: true

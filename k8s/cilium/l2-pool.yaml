# Cilium L2 announcement pool — gives LoadBalancer services a LAN IP
# Apply after Cilium is running: kubectl apply -f l2-pool.yaml
# Adjust the range to IPs not used by your DHCP server
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: home-pool
spec:
  blocks:
    - start: 192.168.1.200
      stop: 192.168.1.200
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: home-l2
spec:
  loadBalancerIPs: true
  interfaces:
    - eth0
  nodeSelector:
    matchLabels: {}   # all nodes
